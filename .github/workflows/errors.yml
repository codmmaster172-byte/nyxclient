name: errors
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 8 }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 2.14.1 }
      - run: unzip nyxclient-2.0-src.zip
      - run: cd nyxclient && gradle setupDecompWorkspace build --no-daemon > ../build.log 2>&1
      - name: SHOW ERRORS
        if: always()
        run: |
          msg=$(grep -A2 "\.java:[0-9]*: error" build.log | head -45 | tr '\n' '|')
          echo "::error title=JAVA ERRORS::$msg"
          tail=$(tail -n 25 build.log | tr '\n' '|')
          echo "::error title=LOG END::$tail"
      - uses: actions/upload-artifact@v4
        with: { name: nyxclient, path: nyxclient/build/libs/*.jar }
